name: Build Librera AI APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Dummy release signing properties (CI-only; used by the release buildType)
        run: |
          cat >> gradle.properties <<'PROPS'
          RELEASE_STORE_FILE=dummy-release.jks
          RELEASE_STORE_PASSWORD=dummy
          RELEASE_KEY_ALIAS=dummy
          RELEASE_KEY_PASSWORD=dummy
          librera_appGdriveKey=
          librera_admobAppId=
          librera_admobBannerId=
          librera_admobFullId=
          librera_admobRewardId=
          pro_appGdriveKey=
          pro_admobAppId=
          pro_admobBannerId=
          pro_admobFullId=
          pro_admobRewardId=
          pdf_classic_appGdriveKey=
          pdf_classic_admobAppId=
          pdf_classic_admobBannerId=
          pdf_classic_admobFullId=
          pdf_classic_admobRewardId=
          ebooka_appGdriveKey=
          ebooka_admobAppId=
          ebooka_admobBannerId=
          ebooka_admobFullId=
          ebooka_admobRewardId=
          pdf_v2_appGdriveKey=
          pdf_v2_admobAppId=
          pdf_v2_admobBannerId=
          pdf_v2_admobFullId=
          pdf_v2_admobRewardId=
          epub_reader_appGdriveKey=
          epub_reader_admobAppId=
          epub_reader_admobBannerId=
          epub_reader_admobFullId=
          epub_reader_admobRewardId=
          tts_reader_appGdriveKey=
          tts_reader_admobAppId=
          tts_reader_admobBannerId=
          tts_reader_admobFullId=
          tts_reader_admobRewardId=
          PROPS

      - name: Dummy google-services.json (CI-only, fdroid release build)
        run: |
          cat > app/google-services.json <<'GSJ'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project-id",
              "storage_bucket": "dummy-project-id.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.foobnix.pdf.reader.ai" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDUMMYKEY0000000000000000000000000" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          GSJ

      - name: Bundle Kokoro-7M-Distill + RE-USE models
        run: |
          set -e
          python3 - <<'PYEOF'
          import json, urllib.request, os, sys, tarfile
          BUNDLE = 'marwanelamami/kokoro-7m-distill-sherpa-onnx'
          BUNDLE_PIN = open('kokoro-7m-pin.txt').read().strip()
          meta = json.load(urllib.request.urlopen('https://huggingface.co/api/models/' + BUNDLE))
          if meta.get('sha') != BUNDLE_PIN:
              sys.exit('Kokoro-7M bundle pin mismatch: repo sha %s != pinned %s' % (meta.get('sha'), BUNDLE_PIN))
          dest = 'app/src/main/assets/kokoro'
          os.makedirs(dest, exist_ok=True)
          for name in ('model.int8.onnx', 'voices.bin', 'tokens.txt', 'lexicon-us-en.txt'):
              url = 'https://huggingface.co/%s/resolve/%s/%s' % (BUNDLE, BUNDLE_PIN, name)
              out = os.path.join(dest, name)
              urllib.request.urlretrieve(url, out)
              print('bundled', name, os.path.getsize(out), 'bytes')
          # espeak-ng-data: phonemizer data for out-of-lexicon words
          urllib.request.urlretrieve(
              'https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/espeak-ng-data.tar.bz2',
              '/tmp/espeak.tar.bz2')
          with tarfile.open('/tmp/espeak.tar.bz2') as t:
              t.extractall(dest)
          cnt = sum(len(fns) for _, _, fns in os.walk(os.path.join(dest, 'espeak-ng-data')))
          print('espeak-ng-data files:', cnt)
          assert cnt >= 300, 'espeak-ng-data looks incomplete'
          PYEOF
          # stamp version=2 so the (patched) runtime takes the misaki-derived
          # lexicon path instead of raw espeak for every word
          pip install -q onnx
          python3 - <<'PYEOF'
          import onnx
          p = 'app/src/main/assets/kokoro/model.int8.onnx'
          m = onnx.load(p)
          found = False
          for prop in m.metadata_props:
              if prop.key == 'version':
                  prop.value = '2'
                  found = True
          assert found, 'version metadata missing'
          onnx.checker.check_model(m)
          onnx.save(m, p)
          print('kokoro-7m stamped: version=2')
          PYEOF
          du -sh app/src/main/assets/kokoro

      - name: Export NVIDIA RE-USE voice-enhancement model (ONNX int8)
        run: |
          set -e
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q safetensors onnx onnxruntime numpy
          python3 - <<'PYEOF'
          import json, urllib.request, os, sys
          REPO = 'nvidia/RE-USE'
          PIN = open('reuse-pin.txt').read().strip()
          meta = json.load(urllib.request.urlopen('https://huggingface.co/api/models/' + REPO))
          if meta.get('sha') != PIN:
              sys.exit('RE-USE pin mismatch: repo sha %s != pinned %s' % (meta.get('sha'), PIN))
          os.makedirs('/tmp/reuse', exist_ok=True)
          for name in ('model.safetensors', 'config.json'):
              urllib.request.urlretrieve(
                  'https://huggingface.co/%s/resolve/%s/%s' % (REPO, PIN, name),
                  '/tmp/reuse/' + name)
              print(name, os.path.getsize('/tmp/reuse/' + name), 'bytes')
          PYEOF
          # 200 frames = 2.0 s chunks at 16 kHz; SKIP_REF skips the slow eager
          # reference-pipeline cross-check (the graph math is validated by the
          # STFT/iSTFT roundtrip assertion inside the exporter)
          SKIP_REF=1 python3 scripts/reuse/export_onnx.py \
              /tmp/reuse/model.safetensors /tmp/reuse/reuse_fp32.onnx 200
          python3 - <<'PYEOF'
          import numpy as np, onnxruntime as ort, os, time
          from onnxruntime.quantization import quantize_dynamic, QuantType
          os.makedirs('app/src/main/assets/reuse', exist_ok=True)
          quantize_dynamic('/tmp/reuse/reuse_fp32.onnx',
                           'app/src/main/assets/reuse/model.int8.onnx',
                           weight_type=QuantType.QInt8)
          out = 'app/src/main/assets/reuse/model.int8.onnx'
          print('quantized:', os.path.getsize(out), 'bytes')
          # smoke: run 2 s of speech-like signal through the shipped model
          opts = ort.SessionOptions()
          opts.intra_op_num_threads = 4
          s = ort.InferenceSession(out, opts, providers=['CPUExecutionProvider'])
          t = np.linspace(0, 2.0, 32000, dtype=np.float32)
          wav = (0.3 * np.sin(2 * np.pi * 220 * t)
                 + 0.15 * np.sin(2 * np.pi * 660 * t)).astype(np.float32)
          t0 = time.time()
          y = s.run(None, {'pcm_in': wav.reshape(1, -1)})[0]
          dt = time.time() - t0
          assert y.shape[-1] == 32000, 'unexpected output shape %s' % (y.shape,)
          assert np.all(np.isfinite(y)), 'non-finite output'
          print('RE-USE smoke OK: 2.0s audio in %.2fs (RTF %.2f on CI CPU), max|y|=%.3f'
                % (dt, dt / 2.0, float(np.abs(y).max())))
          PYEOF
          du -sh app/src/main/assets/reuse

      - name: Build native sherpa-onnx JNI libs (lexicon-first patch, static)
        run: |
          set -e
          git clone --depth 1 --branch v1.13.8 https://github.com/k2-fsa/sherpa-onnx /tmp/sherpa-onnx
          python3 scripts/ci/patch_sherpa.py /tmp/sherpa-onnx
          export ANDROID_NDK=$ANDROID_NDK_LATEST_HOME
          export BUILD_SHARED_LIBS=OFF
          echo "ANDROID_NDK: $ANDROID_NDK"
          build_abi() {
            ABI=$1; SCRIPT=$2; BUILDDIR=$3
            echo "== building $ABI =="
            (cd /tmp/sherpa-onnx && $SCRIPT)
            DST="$GITHUB_WORKSPACE/app/src/main/jniLibs/$ABI"
            mkdir -p "$DST"
            cp /tmp/sherpa-onnx/$BUILDDIR/install/lib/libsherpa-onnx-jni.so "$DST/"
            # static builds embed onnxruntime; libc++_shared is still needed
            CPP=$(find /tmp/sherpa-onnx/$BUILDDIR/install/lib -name "libc++_shared.so" | head -1)
            if [ -n "$CPP" ]; then cp "$CPP" "$DST/"; fi
            ls -la "$DST/"
          }
          build_abi arm64-v8a  ./build-android-arm64-v8a.sh  build-android-arm64-v8a-static
          build_abi armeabi-v7a ./build-android-armv7-eabi.sh build-android-armv7-eabi-static
          build_abi x86_64    ./build-android-x86-64.sh     build-android-x86-64-static

      - name: Build APK (fdroid flavor, release-optimized R8)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFdroidRelease --no-daemon --stacktrace

      - name: Verify APK contents + JNI symbols
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | grep -i arm64 | head -1)
          if [ -z "$APK" ]; then APK=$(find app/build/outputs/apk -name "*.apk" | sort | head -1); fi
          echo "Verifying: $APK"
          python3 scripts/ci/verify_apk.py "$APK" app/src/main/java/com/k2fsa/sherpa/onnx

      - name: Functional TTS smoke test (real synthesis with the shipped model)
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | grep -i arm64 | head -1)
          if [ -z "$APK" ]; then APK=$(find app/build/outputs/apk -name "*.apk" | sort | head -1); fi
          rm -rf /tmp/ktest && mkdir -p /tmp/ktest
          unzip -q "$APK" 'assets/kokoro/*' -d /tmp/ktest
          D=/tmp/ktest/assets/kokoro
          du -sh "$D"
          pip install -q sherpa-onnx
          python3 scripts/ci/tts_smoke_test.py "$D" /tmp/ktest/test.wav
          python3 scripts/ci/check_wav.py /tmp/ktest/test.wav

      - name: Collect APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name "*.apk" -exec du -h {} \;
          APK=$(find app/build/outputs/apk -name "*.apk" | grep -i "arm64" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find app/build/outputs/apk -name "*.apk" | grep -i "universal" | head -1)
          fi
          if [ -z "$APK" ]; then
            APK=$(find app/build/outputs/apk -name "*.apk" | sort | head -1)
          fi
          echo "Found APK: $APK"
          if [ -z "$APK" ]; then
            find app/build/outputs -type f | head -30
            exit 1
          fi
          cp "$APK" dist/Librera-AI-Kokoro.apk
          X86=$(find app/build/outputs/apk -name "*.apk" | grep -i "x86_64" | head -1)
          if [ -n "$X86" ]; then cp "$X86" dist/Librera-AI-Kokoro-x86_64.apk; fi
          ARM=$(find app/build/outputs/apk -name "*.apk" | grep -i -- "-arm\." | head -1)
          if [ -n "$ARM" ]; then cp "$ARM" dist/Librera-AI-Kokoro-arm32.apk; fi
          ls -la dist

      - name: Verify installability (apksigner signature + 16KB alignment)
        run: |
          set -e
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose dist/Librera-AI-Kokoro.apk
          if [ -f dist/Librera-AI-Kokoro-arm32.apk ]; then
            "$APKSIGNER" verify --verbose dist/Librera-AI-Kokoro-arm32.apk
          fi
          python3 - <<'PY'
          import struct, zipfile
          for apk in ['dist/Librera-AI-Kokoro.apk', 'dist/Librera-AI-Kokoro-arm32.apk']:
              try:
                  z = zipfile.ZipFile(apk)
              except OSError:
                  continue
              def off(info):
                  z.fp.seek(info.header_offset)
                  h = z.fp.read(30)
                  n, e = struct.unpack('<HH', h[26:30])
                  return info.header_offset + 30 + n + e
              bad = [i.filename for i in z.infolist()
                     if i.filename.endswith('.so') and i.compress_type == 0 and off(i) % 16384]
              assert not bad, '%s: .so not 16KB-aligned: %s' % (apk, bad)
              print('%s: signature + 16KB alignment OK (%d entries)' % (apk, len(z.namelist())))
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: librera-apks
          path: dist/*.apk

  emulator-test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    steps:
      - name: Checkout (test script)
        uses: actions/checkout@v4

      - name: Setup JDK (for sdkmanager/aapt)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: librera-apks
          path: dist

      - name: Enable KVM access (fix TCG software-emulation fallback)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm

      - name: Run app on emulator (Android 14 / api 34, x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash scripts/ci/emulator_test.sh

      - name: Upload logcat + UI dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: |
            logcat.txt
            logcat-tts.txt
            ui-reader.xml
            ui.xml
          if-no-files-found: ignore

  emulator-test-arm64:
    runs-on: ubuntu-24.04-arm
    needs: build
    continue-on-error: true # no official Android emulator package for Linux ARM64 hosts yet
    timeout-minutes: 90
    steps:
      - name: Checkout (test script)
        uses: actions/checkout@v4

      - name: Setup JDK (for sdkmanager/aapt)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: librera-apks
          path: dist

      - name: KVM access (best-effort; arm runners may lack KVM => TCG fallback)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules || true
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true
          (ls -l /dev/kvm || echo "no KVM on this runner - emulator will use TCG software emulation (slow)")

      - name: Run app on emulator (Android 14 / api 34, arm64 - what real phones run)
        env:
          TEST_APK: dist/Librera-AI-Kokoro.apk
          TTS_SLEEP: "600"
          RU_SLEEP: "600"
          STRICT_RU: "0"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: arm64-v8a
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          emulator-boot-timeout: 1800
          boot-timeout: 1800
          script: bash scripts/ci/emulator_test.sh

      - name: Upload logcat + UI dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat-arm64
          path: |
            logcat.txt
            logcat-tts.txt
            ui-reader.xml
            logcat-tts-ru.txt
            ui.xml
          if-no-files-found: ignore

  release:
    runs-on: ubuntu-latest
    needs: [build, emulator-test]
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: librera-apks
          path: dist

      - name: Clean stale release assets (prevent trap/duplicate assets)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          REPO = 'FreedoomForm/LibreraReader'
          TAG = 'librera-apk-latest'
          KEEP = {'Librera-AI-Kokoro.apk', 'Librera-AI-Kokoro-arm32.apk', 'SHA256SUMS.txt'}
          H = {'Authorization': 'token ' + os.environ['GITHUB_TOKEN'], 'User-Agent': 'ci-cleanup'}
          try:
              url = 'https://api.github.com/repos/%s/releases/tags/%s?nocache=%d' % (REPO, TAG, time.time_ns() % 10**9)
              rel = json.load(urllib.request.urlopen(urllib.request.Request(url, headers=H)))
          except Exception as e:
              print('release lookup skipped:', e)
              raise SystemExit(0)
          for a in rel.get('assets', []):
              if a['name'] not in KEEP:
                  try:
                      u = 'https://api.github.com/repos/%s/releases/assets/%d' % (REPO, a['id'])
                      urllib.request.urlopen(urllib.request.Request(u, headers=H, method='DELETE'))
                      print('deleted stale asset:', a['name'])
                  except Exception as e:
                      print('delete failed:', a['name'], e)
          PY

      - name: Prepare release folder (only user-facing APKs)
        run: |
          mkdir -p dist/release
          cp dist/Librera-AI-Kokoro.apk dist/release/
          if [ -f dist/Librera-AI-Kokoro-arm32.apk ]; then
            cp dist/Librera-AI-Kokoro-arm32.apk dist/release/
          fi
          ls -la dist/release

      - name: Generate SHA256SUMS (published files only)
        run: |
          cd dist/release
          sha256sum Librera-AI-Kokoro.apk > SHA256SUMS.txt
          if [ -f Librera-AI-Kokoro-arm32.apk ]; then
            sha256sum Librera-AI-Kokoro-arm32.apk >> SHA256SUMS.txt
          fi
          cat SHA256SUMS.txt

      - name: Publish to release (tag librera-apk-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: librera-apk-latest
          name: "Librera Reader - Offline AI TTS (Kokoro-7M)"
          files: dist/release/*
          prerelease: true
          allow_updates: true
          replaces_artifacts: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
