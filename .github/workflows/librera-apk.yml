name: Build Librera AI APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Bundle Kokoro model (offline TTS, int8)
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, os, sys
          from concurrent.futures import ThreadPoolExecutor
          REPO = 'csukuangfj/kokoro-int8-multi-lang-v1_0'
          PIN = open('kokoro-model-pin.txt').read().strip()
          meta = json.load(urllib.request.urlopen('https://huggingface.co/api/models/' + REPO))
          if meta.get('sha') != PIN:
              sys.exit('Model pin mismatch: repo sha %s != pinned %s' % (meta.get('sha'), PIN))
          tree = json.load(urllib.request.urlopen(
              'https://huggingface.co/api/models/%s/tree/main?recursive=true' % REPO))
          files = [f for f in tree if f.get('type') == 'file' and 'path' in f]
          if len(files) < 110:
              sys.exit('Tree listing looks incomplete: %d files' % len(files))
          dest = os.path.join(os.environ['GITHUB_WORKSPACE'], 'app/src/main/assets/kokoro')
          def dl(f):
              p = f['path']
              out = os.path.join(dest, p)
              os.makedirs(os.path.dirname(out), exist_ok=True)
              url = 'https://huggingface.co/%s/resolve/%s/%s' % (REPO, PIN, p)
              last = None
              for attempt in range(3):
                  try:
                      urllib.request.urlretrieve(url, out)
                      got = os.path.getsize(out)
                      if int(f.get('size', got)) != got:
                          raise IOError('size mismatch %s: %d != %d' % (p, got, f.get('size')))
                      return
                  except Exception as e:
                      last = e
              raise last
          with ThreadPoolExecutor(6) as ex:
              list(ex.map(dl, files))
          total = sum(os.path.getsize(os.path.join(dp, fn)) for dp, _, fns in os.walk(dest) for fn in fns)
          print('Bundled %d files, %.1f MB' % (len(files), total / 1048576.0))
          PYEOF
          du -sh app/src/main/assets/kokoro

      - name: Build APK (fdroid flavor, debug)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFdroidDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk -name "*fdroid*debug*.apk" | head -1)
          cp "$APK" dist/Librera-AI-Kokoro.apk
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: librera-ai-apk
          path: dist/Librera-AI-Kokoro.apk

      - name: Publish to release (tag librera-apk-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: librera-apk-latest
          name: "Librera Reader - Offline AI TTS (Kokoro-82M)"
          files: dist/Librera-AI-Kokoro.apk
          prerelease: true
          allow_updates: true
          replaces_artifacts: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
