name: Build Librera AI APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Dummy release signing properties (CI-only; debug build never uses them)
        run: |
          cat >> gradle.properties <<'PROPS'
          RELEASE_STORE_FILE=dummy-release.jks
          RELEASE_STORE_PASSWORD=dummy
          RELEASE_KEY_ALIAS=dummy
          RELEASE_KEY_PASSWORD=dummy
          librera_appGdriveKey=
          librera_admobAppId=
          librera_admobBannerId=
          librera_admobFullId=
          librera_admobRewardId=
          pro_appGdriveKey=
          pro_admobAppId=
          pro_admobBannerId=
          pro_admobFullId=
          pro_admobRewardId=
          pdf_classic_appGdriveKey=
          pdf_classic_admobAppId=
          pdf_classic_admobBannerId=
          pdf_classic_admobFullId=
          pdf_classic_admobRewardId=
          ebooka_appGdriveKey=
          ebooka_admobAppId=
          ebooka_admobBannerId=
          ebooka_admobFullId=
          ebooka_admobRewardId=
          pdf_v2_appGdriveKey=
          pdf_v2_admobAppId=
          pdf_v2_admobBannerId=
          pdf_v2_admobFullId=
          pdf_v2_admobRewardId=
          epub_reader_appGdriveKey=
          epub_reader_admobAppId=
          epub_reader_admobBannerId=
          epub_reader_admobFullId=
          epub_reader_admobRewardId=
          tts_reader_appGdriveKey=
          tts_reader_admobAppId=
          tts_reader_admobBannerId=
          tts_reader_admobFullId=
          tts_reader_admobRewardId=
          PROPS

      - name: Dummy google-services.json (CI-only, fdroid debug build)
        run: |
          cat > app/google-services.json <<'GSJ'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project-id",
              "storage_bucket": "dummy-project-id.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.foobnix.pdf.reader.ai" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDUMMYKEY0000000000000000000000000" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          GSJ

      - name: Bundle Kokoro model (offline TTS, int8)
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, urllib.parse, os, sys
          from concurrent.futures import ThreadPoolExecutor
          REPO = 'csukuangfj/kokoro-int8-multi-lang-v1_0'
          PIN = open('kokoro-model-pin.txt').read().strip()
          meta = json.load(urllib.request.urlopen('https://huggingface.co/api/models/' + REPO))
          if meta.get('sha') != PIN:
              sys.exit('Model pin mismatch: repo sha %s != pinned %s' % (meta.get('sha'), PIN))
          tree = json.load(urllib.request.urlopen(
              'https://huggingface.co/api/models/%s/tree/main?recursive=true' % REPO))
          files = [f for f in tree if f.get('type') == 'file' and 'path' in f]
          if len(files) < 110:
              sys.exit('Tree listing looks incomplete: %d files' % len(files))
          dest = os.path.join(os.environ['GITHUB_WORKSPACE'], 'app/src/main/assets/kokoro')
          def dl(f):
              p = f['path']
              out = os.path.join(dest, p)
              os.makedirs(os.path.dirname(out), exist_ok=True)
              url = 'https://huggingface.co/%s/resolve/%s/%s' % (REPO, PIN, urllib.parse.quote(p, safe='/'))
              last = None
              for attempt in range(3):
                  try:
                      urllib.request.urlretrieve(url, out)
                      got = os.path.getsize(out)
                      if int(f.get('size', got)) != got:
                          raise IOError('size mismatch %s: %d != %d' % (p, got, f.get('size')))
                      return
                  except Exception as e:
                      last = e
              raise last
          with ThreadPoolExecutor(6) as ex:
              list(ex.map(dl, files))
          total = sum(os.path.getsize(os.path.join(dp, fn)) for dp, _, fns in os.walk(dest) for fn in fns)
          print('Bundled %d files, %.1f MB' % (len(files), total / 1048576.0))
          PYEOF
          du -sh app/src/main/assets/kokoro

      - name: Add x86_64 native libs (for emulator smoke test)
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/x86_64
          curl -sL -o /tmp/ort.aar "https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/1.28.2/onnxruntime-android-1.28.2.aar"
          unzip -q -o /tmp/ort.aar "jni/x86_64/*" -d /tmp/ort
          cp /tmp/ort/jni/x86_64/libonnxruntime.so app/src/main/jniLibs/x86_64/
          SHP_URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-android.tar.bz2"
          curl -sL -o /tmp/shp.tar.bz2 "$SHP_URL"
          mkdir -p /tmp/shp && tar -xjf /tmp/shp.tar.bz2 -C /tmp/shp
          SHP=$(find /tmp/shp -name "libsherpa-onnx-jni.so" -path "*x86_64*" | head -1)
          echo "found: $SHP"
          cp "$SHP" app/src/main/jniLibs/x86_64/
          ls -la app/src/main/jniLibs/x86_64/

      - name: Build APK (fdroid flavor, debug)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFdroidDebug --no-daemon --stacktrace

      - name: Verify APK contents + JNI symbols
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | grep -i arm64 | head -1)
          if [ -z "$APK" ]; then APK=$(find app/build/outputs/apk -name "*.apk" | sort | head -1); fi
          echo "Verifying: $APK"
          python3 scripts/ci/verify_apk.py "$APK" app/src/main/java/com/k2fsa/sherpa/onnx

      - name: Functional TTS smoke test (real synthesis with the shipped model)
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | grep -i arm64 | head -1)
          if [ -z "$APK" ]; then APK=$(find app/build/outputs/apk -name "*.apk" | sort | head -1); fi
          rm -rf /tmp/ktest && mkdir -p /tmp/ktest
          unzip -q "$APK" 'assets/kokoro/*' -d /tmp/ktest
          D=/tmp/ktest/assets/kokoro
          du -sh "$D"
          pip install -q sherpa-onnx
          python3 scripts/ci/tts_smoke_test.py "$D" /tmp/ktest/test.wav
          python3 scripts/ci/check_wav.py /tmp/ktest/test.wav

      - name: Collect APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name "*.apk" -exec du -h {} \;
          APK=$(find app/build/outputs/apk -name "*.apk" | grep -i "arm64" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find app/build/outputs/apk -name "*.apk" | grep -i "universal" | head -1)
          fi
          if [ -z "$APK" ]; then
            APK=$(find app/build/outputs/apk -name "*.apk" | sort | head -1)
          fi
          echo "Found APK: $APK"
          if [ -z "$APK" ]; then
            find app/build/outputs -type f | head -30
            exit 1
          fi
          cp "$APK" dist/Librera-AI-Kokoro.apk
          X86=$(find app/build/outputs/apk -name "*.apk" | grep -i "x86_64" | head -1)
          if [ -n "$X86" ]; then cp "$X86" dist/Librera-AI-Kokoro-x86_64.apk; fi
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: librera-apks
          path: dist/*.apk

  emulator-test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    steps:
      - name: Setup JDK (for sdkmanager/aapt)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: librera-apks
          path: dist

      - name: Run app on emulator (Android 14 / api 34, x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            APK=$(find dist -name "*x86_64*.apk" | head -1)
            echo "Installing: $APK"
            adb install -r "$APK"
            PKG=com.foobnix.pdf.reader.ai
            AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | tail -1)
            LAUNCHER=$("$AAPT" dump badging "$APK" | grep launchable-activity | sed -E "s/.*name='([^']+)'.*/\1/")
            echo "Package: $PKG  Launcher: $LAUNCHER"
            adb shell am start -W -n "$PKG/$LAUNCHER"
            sleep 40
            adb logcat -d > logcat.txt || true
            PID=$(adb shell pidof "$PKG" | tr -d '\r\n ')
            echo "App PID: $PID"
            FATALS=$(grep -c "FATAL EXCEPTION" logcat.txt || true)
            ANRS=$(grep -c "ANR in " logcat.txt || true)
            echo "FATAL EXCEPTIONS: $FATALS | ANRs: $ANRS | Android: $(adb shell getprop ro.build.version.release | tr -d '\r')"
            if [ -z "$PID" ]; then
              echo "::error::APP CRASHED ON EMULATOR - process not alive after start"
              grep -A 50 "FATAL EXCEPTION" logcat.txt || true
              exit 1
            fi
            if [ "$FATALS" != "0" ]; then
              echo "::error::FATAL EXCEPTION found in logcat"
              grep -A 50 "FATAL EXCEPTION" logcat.txt
              exit 1
            fi
            adb shell uiautomator dump /sdcard/ui.xml || true
            adb pull /sdcard/ui.xml ui.xml || true
            if [ -f ui.xml ]; then grep -o 'text="[^"]\{1,40\}"' ui.xml | head -15; fi
            echo "EMULATOR SMOKE TEST PASSED: app launched and stayed alive with no crashes"

      - name: Upload logcat + UI dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: |
            logcat.txt
            ui.xml
          if-no-files-found: ignore

  release:
    runs-on: ubuntu-latest
    needs: [build, emulator-test]
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: librera-apks
          path: dist

      - name: Publish to release (tag librera-apk-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: librera-apk-latest
          name: "Librera Reader - Offline AI TTS (Kokoro-82M)"
          files: dist/Librera-AI-Kokoro.apk
          prerelease: true
          allow_updates: true
          replaces_artifacts: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
